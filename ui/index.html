<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FlyNAS</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            padding: 0;
            margin: 0;
            pointer-events: none;
            background: rgb(20, 23, 31);
        }
        div, a, img {
            position: absolute;
            box-sizing: border-box;
            -webkit-backface-visibility: hidden;
            pointer-events: none;
        }
        a {
            cursor: pointer;
            pointer-events: all;
        }
        .text {
            pointer-events: all;
            white-space: pre;
        }
    </style>
</head>
<!-- QR Code Generator by Kazuhiko Arase, MIT (vendored, see ui/qrcode.js) -->
<script src="/qrcode.js"></script>
<script type="module">
    // ----------------------------------------------------------------
    // Clay HTML renderer glue, adapted from the official Clay web
    // example (examples/clay-official-website). Canvas renderer and
    // renderer switching removed — FlyNAS renders HTML only.
    // ----------------------------------------------------------------
    const CLAY_RENDER_COMMAND_TYPE_NONE = 0;
    const CLAY_RENDER_COMMAND_TYPE_RECTANGLE = 1;
    const CLAY_RENDER_COMMAND_TYPE_BORDER = 2;
    const CLAY_RENDER_COMMAND_TYPE_TEXT = 3;
    const CLAY_RENDER_COMMAND_TYPE_IMAGE = 4;
    const CLAY_RENDER_COMMAND_TYPE_SCISSOR_START = 5;
    const CLAY_RENDER_COMMAND_TYPE_SCISSOR_END = 6;
    const CLAY_RENDER_COMMAND_TYPE_CUSTOM = 7;
    const GLOBAL_FONT_SCALING_FACTOR = 0.8;
    let renderCommandSize = 0;
    let scratchSpaceAddress = 8;
    let heapSpaceAddress = 0;
    let memoryDataView;
    let textDecoder = new TextDecoder("utf-8");
    let textEncoder = new TextEncoder();
    let previousFrameTime;
    let fontsById = [
        "system-ui, 'Segoe UI', Roboto, sans-serif",
        "'SF Mono', Menlo, Consolas, monospace",
    ];
    let elementCache = {};
    let colorDefinition = { type: 'struct', members: [
        {name: 'r', type: 'float' },
        {name: 'g', type: 'float' },
        {name: 'b', type: 'float' },
        {name: 'a', type: 'float' },
    ]};
    let stringDefinition = { type: 'struct', members: [
        {name: 'isStaticallyAllocated', type: 'uint32_t'},
        {name: 'length', type: 'uint32_t' },
        {name: 'chars', type: 'uint32_t' },
    ]};
    let stringSliceDefinition = { type: 'struct', members: [
        {name: 'length', type: 'uint32_t' },
        {name: 'chars', type: 'uint32_t' },
        {name: 'baseChars', type: 'uint32_t' },
    ]};
    let borderWidthDefinition = { type: 'struct', members: [
        {name: 'left', type: 'uint16_t'},
        {name: 'right', type: 'uint16_t'},
        {name: 'top', type: 'uint16_t'},
        {name: 'bottom', type: 'uint16_t'},
        {name: 'betweenChildren', type: 'uint16_t'},
    ]};
    let cornerRadiusDefinition = { type: 'struct', members: [
        {name: 'topLeft', type: 'float'},
        {name: 'topRight', type: 'float'},
        {name: 'bottomLeft', type: 'float'},
        {name: 'bottomRight', type: 'float'},
    ]};
    let textConfigDefinition = { name: 'text', type: 'struct', members: [
        { name: 'userData', type: 'uint32_t' },
        { name: 'textColor', ...colorDefinition },
        { name: 'fontId', type: 'uint16_t' },
        { name: 'fontSize', type: 'uint16_t' },
        { name: 'letterSpacing', type: 'uint16_t' },
        { name: 'lineSpacing', type: 'uint16_t' },
        { name: 'wrapMode', type: 'uint8_t' },
        { name: 'disablePointerEvents', type: 'uint8_t' },
        { name: '_padding', type: 'uint16_t' },
    ]};
    let textRenderDataDefinition = { type: 'struct', members: [
        { name: 'stringContents', ...stringSliceDefinition },
        { name: 'textColor', ...colorDefinition },
        { name: 'fontId', type: 'uint16_t' },
        { name: 'fontSize', type: 'uint16_t' },
        { name: 'letterSpacing', type: 'uint16_t' },
        { name: 'lineHeight', type: 'uint16_t' },
    ]};
    let rectangleRenderDataDefinition = { type: 'struct', members: [
        { name: 'backgroundColor', ...colorDefinition },
        { name: 'cornerRadius', ...cornerRadiusDefinition },
    ]};
    let imageRenderDataDefinition = { type: 'struct', members: [
        { name: 'backgroundColor', ...colorDefinition },
        { name: 'cornerRadius', ...cornerRadiusDefinition },
        { name: 'imageData', type: 'uint32_t' },
    ]};
    let customRenderDataDefinition = { type: 'struct', members: [
        { name: 'backgroundColor', ...colorDefinition },
        { name: 'cornerRadius', ...cornerRadiusDefinition },
        { name: 'customData', type: 'uint32_t' },
    ]};
    let borderRenderDataDefinition = { type: 'struct', members: [
        { name: 'color', ...colorDefinition },
        { name: 'cornerRadius', ...cornerRadiusDefinition },
        { name: 'width', ...borderWidthDefinition },
        { name: 'padding', type: 'uint16_t'}
    ]};
    let clipRenderDataDefinition = { type: 'struct', members: [
        { name: 'horizontal', type: 'bool' },
        { name: 'vertical', type: 'bool' },
    ]};
    let customHTMLDataDefinition = { type: 'struct', members: [
        { name: 'link', ...stringDefinition },
        { name: 'cursorPointer', type: 'uint8_t' },
        { name: 'disablePointerEvents', type: 'uint8_t' },
        { name: 'padding', type: 'uint16_t'}
    ]};
    let renderCommandDefinition = {
        name: 'Clay_RenderCommand',
        type: 'struct',
        members: [
            { name: 'boundingBox', type: 'struct', members: [
                { name: 'x', type: 'float' },
                { name: 'y', type: 'float' },
                { name: 'width', type: 'float' },
                { name: 'height', type: 'float' },
            ]},
            { name: 'renderData', type: 'union', members: [
                { name: 'rectangle', ...rectangleRenderDataDefinition },
                { name: 'text', ...textRenderDataDefinition },
                { name: 'image', ...imageRenderDataDefinition },
                { name: 'custom', ...customRenderDataDefinition },
                { name: 'border', ...borderRenderDataDefinition },
                { name: 'clip', ...clipRenderDataDefinition },
            ]},
            { name: 'userData', type: 'uint32_t'},
            { name: 'id', type: 'uint32_t' },
            { name: 'zIndex', type: 'int16_t' },
            { name: 'commandType', type: 'uint8_t' },
            { name: '_padding', type: 'uint8_t' },
        ]
    };

    function getStructTotalSize(definition) {
        switch(definition.type) {
            case 'union':
            case 'struct': {
                let totalSize = 0;
                for (const member of definition.members) {
                    let result = getStructTotalSize(member);
                    if (definition.type === 'struct') {
                        totalSize += result;
                    } else {
                        totalSize = Math.max(totalSize, result);
                    }
                }
                return totalSize;
            }
            case 'float': return 4;
            case 'uint32_t': return 4;
            case 'int32_t': return 4;
            case 'uint16_t': return 2;
            case 'int16_t': return 2;
            case 'uint8_t': return 1;
            case 'bool': return 1;
            default: {
                throw "Unimplemented C data type " + definition.type
            }
        }
    }

    function readStructAtAddress(address, definition) {
        switch(definition.type) {
            case 'union':
            case 'struct': {
                let struct = { __size: 0 };
                for (const member of definition.members) {
                    let result = readStructAtAddress(address, member);
                    struct[member.name] = result;
                    if (definition.type === 'struct') {
                        struct.__size += result.__size;
                        address += result.__size;
                    } else {
                        struct.__size = Math.max(struct.__size, result.__size);
                    }
                }
                return struct;
            }
            case 'float': return { value: memoryDataView.getFloat32(address, true), __size: 4 };
            case 'uint32_t': return { value: memoryDataView.getUint32(address, true), __size: 4 };
            case 'int32_t': return { value: memoryDataView.getUint32(address, true), __size: 4 };
            case 'uint16_t': return { value: memoryDataView.getUint16(address, true), __size: 2 };
            case 'int16_t': return { value: memoryDataView.getInt16(address, true), __size: 2 };
            case 'uint8_t': return { value: memoryDataView.getUint8(address, true), __size: 1 };
            case 'bool': return { value: memoryDataView.getUint8(address, true), __size: 1 };
            default: {
                throw "Unimplemented C data type " + definition.type
            }
        }
    }

    function getTextDimensions(text, font) {
        window.canvasContext.font = font;
        let metrics = window.canvasContext.measureText(text);
        return { width: metrics.width, height: metrics.fontBoundingBoxAscent + metrics.fontBoundingBoxDescent };
    }

    function createMainArena(arenaStructAddress, arenaMemoryAddress) {
        let memorySize = instance.exports.Clay_MinMemorySize();
        instance.exports.Clay_CreateArenaWithCapacityAndMemory(arenaStructAddress, memorySize, arenaMemoryAddress);
    }

    // ----------------------------------------------------------------
    // FlyNAS data layer: poll the REST API, format display strings,
    // write them into the wasm string pool and call the exported
    // setters. All formatting happens here — C code only does layout.
    // ----------------------------------------------------------------
    let stringPoolBase = 0;
    let stringPoolOffset = 0;

    function poolReset() { stringPoolOffset = 0; }
    function poolWrite(str) {
        const bytes = textEncoder.encode(str);
        const off = stringPoolOffset;
        new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
        stringPoolOffset += bytes.length;
        return { off, len: bytes.length };
    }

    function fmtBytes(n) {
        if (n == null) return '-';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        let i = 0;
        while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
        return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + ' ' + units[i];
    }

    function fmtUptime(sec) {
        if (sec == null) return '-';
        const d = Math.floor(sec / 86400);
        const h = Math.floor((sec % 86400) / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return (d > 0 ? d + 'd ' : '') + h + 'h ' + m + 'm';
    }

    async function getJSON(url) {
        const resp = await fetch(url, { credentials: 'same-origin' });
        if (resp.status === 401) throw 'unauthorized';
        if (!resp.ok) throw 'http ' + resp.status;
        return resp.json();
    }

    // ----------------------------------------------------------------
    // Auth flow: screen transitions and API calls live here; the C
    // side only renders the active screen and reports button presses.
    // ----------------------------------------------------------------
    const SCREEN_LOADING = 0, SCREEN_SETUP_USERNAME = 1, SCREEN_SETUP_TOTP = 2,
          SCREEN_LOGIN_USERNAME = 3, SCREEN_LOGIN_CODE = 4, SCREEN_MAIN = 5;
    const ACTION_SUBMIT = 1, ACTION_BACK = 2;
    // String pool regions (see STRING_POOL_SIZE in main.c): dashboard
    // poolReset()/poolWrite() uses offset 0 upward, auth strings live
    // at 12288, the QR data URL at 16384 — so they never clobber
    // each other.
    const AUTH_POOL_BASE = 12288;
    const QR_POOL_BASE = 16384;
    const QR_POOL_SIZE = 16384;
    const ACCOUNTS_POOL_BASE = 32768;
    const STOR_POOL_BASE = 49152;
    const NET_POOL_BASE = 65536;
    const BAK_POOL_BASE = 81920;

    let authScreen = SCREEN_LOADING;
    let authInputText = '';
    let authErrorText = '';
    let authInfoText = '';
    let setupToken = null;
    let loginToken = null;
    let authBusy = false;
    let dashboardTimer = null;

    function syncAuth() {
        let off = AUTH_POOL_BASE;
        const write = (str) => {
            const bytes = textEncoder.encode(str.slice(0, 256));
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
            const r = { off, len: bytes.length };
            off += bytes.length;
            return r;
        };
        const inp = write(authInputText);
        const err = write(authErrorText);
        const info = write(authInfoText);
        instance.exports.SetAuthInput(inp.off, inp.len);
        instance.exports.SetAuthError(err.off, err.len);
        instance.exports.SetAuthInfo(info.off, info.len);
        instance.exports.SetScreen(authScreen);
    }

    function setAuthScreen(screen, info) {
        authScreen = screen;
        authInputText = '';
        authErrorText = '';
        authInfoText = info || '';
        instance.exports.SetAuthQr(0, 0);
        syncAuth();
    }

    function makeQrDataUrl(text) {
        const qr = qrcode(0, 'M'); // version auto, ECC level M
        qr.addData(text);
        qr.make();
        const n = qr.getModuleCount();
        const scale = 6, quiet = 4;
        const size = (n + quiet * 2) * scale;
        const c = document.createElement('canvas');
        c.width = c.height = size;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#000';
        for (let row = 0; row < n; row++) {
            for (let col = 0; col < n; col++) {
                if (qr.isDark(row, col)) {
                    ctx.fillRect((col + quiet) * scale, (row + quiet) * scale, scale, scale);
                }
            }
        }
        return c.toDataURL('image/png');
    }

    function setAuthQr(totpUri) {
        try {
            const bytes = textEncoder.encode(makeQrDataUrl(totpUri));
            if (bytes.length > QR_POOL_SIZE) return; // manual secret entry still works
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + QR_POOL_BASE, bytes.length).set(bytes);
            instance.exports.SetAuthQr(QR_POOL_BASE, bytes.length);
        } catch (err) {
            console.log('QR generation failed:', err);
        }
    }

    function enterMain() {
        setupToken = null;
        loginToken = null;
        authScreen = SCREEN_MAIN;
        instance.exports.SetScreen(SCREEN_MAIN);
        refreshDashboard();
        if (!dashboardTimer) dashboardTimer = setInterval(refreshDashboard, 5000);
    }

    async function sendJSON(method, url, body) {
        const resp = await fetch(url, {
            method,
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body || {}),
        });
        let data = {};
        try { data = await resp.json(); } catch (e) {}
        return { ok: resp.ok, status: resp.status, data };
    }

    const postJSON = (url, body) => sendJSON('POST', url, body || {});

    async function submitAuth() {
        if (authBusy || authInputText.length === 0) return;
        authBusy = true;
        authErrorText = '';
        syncAuth();
        try {
            if (authScreen === SCREEN_SETUP_USERNAME) {
                const { ok, data } = await postJSON('/api/setup', { username: authInputText });
                if (ok) {
                    setupToken = data.setup_token;
                    setAuthScreen(SCREEN_SETUP_TOTP, data.totp_secret);
                    setAuthQr(data.totp_uri);
                } else {
                    authErrorText = data.error || 'setup failed';
                }
            } else if (authScreen === SCREEN_SETUP_TOTP) {
                const { ok, data } = await postJSON('/api/setup/confirm',
                    { setup_token: setupToken, totp_code: authInputText });
                if (ok) {
                    enterMain();
                } else if ((data.error || '').includes('token')) {
                    // Pending sessions are one-time use; restart on token errors
                    setAuthScreen(SCREEN_SETUP_USERNAME);
                    authErrorText = 'Setup session expired — start again';
                } else {
                    authErrorText = data.error || 'verification failed';
                }
            } else if (authScreen === SCREEN_LOGIN_USERNAME) {
                const { ok, data } = await postJSON('/api/login', { username: authInputText });
                if (ok) {
                    loginToken = data.login_token;
                    const info = data.auth_method === 'email'
                        ? 'Code sent to ' + (data.email_hint || 'your email')
                        : 'Enter the code from your authenticator app';
                    setAuthScreen(SCREEN_LOGIN_CODE, info);
                } else {
                    authErrorText = data.error || 'login failed';
                }
            } else if (authScreen === SCREEN_LOGIN_CODE) {
                const { ok, data } = await postJSON('/api/login/verify',
                    { login_token: loginToken, code: authInputText });
                if (ok) {
                    enterMain();
                } else if ((data.error || '').includes('token')) {
                    setAuthScreen(SCREEN_LOGIN_USERNAME);
                    authErrorText = 'Login session expired — start again';
                } else {
                    authErrorText = data.error || 'verification failed';
                }
            }
        } catch (err) {
            authErrorText = 'network error';
        }
        authBusy = false;
        if (authScreen !== SCREEN_MAIN) syncAuth();
    }

    function backAuth() {
        if (authScreen === SCREEN_SETUP_TOTP) {
            setAuthScreen(SCREEN_SETUP_USERNAME);
        } else if (authScreen === SCREEN_LOGIN_CODE) {
            setAuthScreen(SCREEN_LOGIN_USERNAME);
        }
    }

    function handleAuthKey(event) {
        if (authScreen === SCREEN_MAIN) {
            const page = instance.exports.GetActivePage();
            if (page === PAGE_ACCOUNTS) {
                handleAccountsKey(event);
            } else if (page === PAGE_STORAGE) {
                handleStorageKey(event);
            } else if (page === PAGE_NETWORK) {
                handleNetworkKey(event);
            } else if (page === PAGE_BACKUP) {
                handleBackupKey(event);
            }
            return;
        }
        if (authScreen === SCREEN_LOADING) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') {
            submitAuth();
        } else if (event.key === 'Backspace') {
            authInputText = authInputText.slice(0, -1);
            syncAuth();
        } else if (event.key === 'Escape') {
            backAuth();
        } else if (event.key.length === 1 && authInputText.length < 64) {
            authInputText += event.key;
            syncAuth();
        } else {
            return;
        }
        event.preventDefault();
    }

    async function startApp() {
        try {
            const sess = await fetch('/api/session', { credentials: 'same-origin' });
            if (sess.ok) {
                enterMain();
                return;
            }
            const status = await getJSON('/api/setup/status');
            setAuthScreen(status.setup_done ? SCREEN_LOGIN_USERNAME : SCREEN_SETUP_USERNAME);
        } catch (err) {
            setAuthScreen(SCREEN_LOGIN_USERNAME);
            authErrorText = 'API unreachable: ' + err;
            syncAuth();
        }
    }

    // ----------------------------------------------------------------
    // Accounts page: C renders rows and queues packed actions (low 4
    // bits = action, rest = row id); we drain them each frame, call
    // the REST API and push fresh data back into the string pool.
    // ----------------------------------------------------------------
    const PAGE_ACCOUNTS = 3;
    const PACT_USER_SUBMIT = 1, PACT_USER_DELETE = 2, PACT_USER_TOGGLE_SSH = 3,
          PACT_USER_KEYGEN = 4, PACT_GROUP_SUBMIT = 5, PACT_GROUP_DELETE = 6,
          PACT_GROUP_SELECT = 7, PACT_MEMBER_TOGGLE = 8, PACT_FOCUS = 9;

    let accUsers = [], accGroups = [];
    let accSelectedGroup = 0;
    let accMembers = new Set();
    let accInputs = ['', ''];   // 0 = new user, 1 = new group
    let accFocus = -1;
    let accError = '';
    let lastActivePage = -1;

    function syncAccounts() {
        let off = ACCOUNTS_POOL_BASE;
        const write = (str) => {
            const bytes = textEncoder.encode(String(str).slice(0, 128));
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
            const r = { off, len: bytes.length };
            off += bytes.length;
            return r;
        };
        instance.exports.ClearUsers();
        for (const u of accUsers) {
            const name = write(u.username);
            const email = write(u.email || '');
            instance.exports.AddUser(u.id, name.off, name.len, email.off, email.len,
                u.totp_enabled ? 1 : 0, u.ssh_enabled ? 1 : 0, u.is_admin ? 1 : 0,
                accMembers.has(u.id) ? 1 : 0);
        }
        instance.exports.ClearGroups();
        for (const g of accGroups) {
            const name = write(g.name);
            const count = write(g.member_count + (g.member_count === 1 ? ' member' : ' members'));
            instance.exports.AddGroup(g.id, name.off, name.len, count.off, count.len);
        }
        const inU = write(accInputs[0]);
        const inG = write(accInputs[1]);
        instance.exports.SetAccountsInputs(inU.off, inU.len, inG.off, inG.len);
        const err = write(accError);
        instance.exports.SetAccountsError(err.off, err.len);
        instance.exports.SetSelectedGroup(accSelectedGroup);
    }

    async function loadAccounts() {
        try {
            const [users, groups] = await Promise.all([
                getJSON('/api/users'), getJSON('/api/groups')]);
            accUsers = Array.isArray(users) ? users : [];
            accGroups = Array.isArray(groups) ? groups : [];
            if (accSelectedGroup && !accGroups.some(g => g.id === accSelectedGroup)) {
                accSelectedGroup = 0;
                accMembers = new Set();
            }
        } catch (err) {
            accError = 'load failed: ' + err;
        }
        syncAccounts();
    }

    async function accountsMutate(promise) {
        accError = '';
        const { ok, data } = await promise;
        if (!ok) accError = data.error || 'request failed';
        await loadAccounts();
    }

    async function selectGroup(gid) {
        if (accSelectedGroup === gid) {
            accSelectedGroup = 0;
            accMembers = new Set();
            syncAccounts();
            return;
        }
        try {
            const detail = await getJSON('/api/groups/' + gid);
            const members = Array.isArray(detail.members) ? detail.members : [];
            accMembers = new Set(members.map(m => m.id));
            accSelectedGroup = gid;
        } catch (err) {
            accError = 'group load failed: ' + err;
        }
        syncAccounts();
    }

    async function keygenUser(uid) {
        const user = accUsers.find(u => u.id === uid);
        if (!user) return;
        const passphrase = window.prompt(
            'Passphrase to encrypt the private key for "' + user.username + '" (min 8 chars):');
        if (!passphrase) return;
        const { ok, data } = await postJSON('/api/users/' + uid + '/keypair', { passphrase });
        if (!ok) {
            accError = data.error || 'keygen failed';
            syncAccounts();
            return;
        }
        const blob = new Blob([data.private_key_encrypted], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'flynas-' + user.username + '-id_ed25519.enc';
        a.click();
        URL.revokeObjectURL(a.href);
        loadAccounts();
    }

    function handlePageAction(packed) {
        const action = packed & 63, arg = packed >> 6;
        if (action >= 19) {
            handleBackupAction(action, arg);
            return;
        }
        if (action >= 15) {
            handleNetworkAction(action, arg);
            return;
        }
        if (action >= 10) {
            handleStorageAction(action, arg);
            return;
        }
        switch (action) {
            case PACT_FOCUS:
                accFocus = arg;
                break;
            case PACT_USER_SUBMIT:
                if (accInputs[0]) {
                    const username = accInputs[0];
                    accInputs[0] = '';
                    accountsMutate(postJSON('/api/users', { username }));
                }
                break;
            case PACT_USER_DELETE:
                accountsMutate(sendJSON('DELETE', '/api/users/' + arg));
                break;
            case PACT_USER_TOGGLE_SSH: {
                const u = accUsers.find(x => x.id === arg);
                if (u) accountsMutate(sendJSON('PUT', '/api/users/' + arg,
                    { ssh_enabled: !u.ssh_enabled }));
                break;
            }
            case PACT_USER_KEYGEN:
                keygenUser(arg);
                break;
            case PACT_GROUP_SUBMIT:
                if (accInputs[1]) {
                    const name = accInputs[1];
                    accInputs[1] = '';
                    accountsMutate(postJSON('/api/groups', { name }));
                }
                break;
            case PACT_GROUP_DELETE:
                if (accSelectedGroup === arg) {
                    accSelectedGroup = 0;
                    accMembers = new Set();
                }
                accountsMutate(sendJSON('DELETE', '/api/groups/' + arg));
                break;
            case PACT_GROUP_SELECT:
                selectGroup(arg);
                break;
            case PACT_MEMBER_TOGGLE:
                if (!accSelectedGroup) break;
                if (accMembers.has(arg)) accMembers.delete(arg);
                else accMembers.add(arg);
                syncAccounts();
                accountsMutate(sendJSON('PUT', '/api/groups/' + accSelectedGroup + '/members',
                    { user_ids: [...accMembers] }));
                break;
        }
    }

    function handleAccountsKey(event) {
        if (accFocus < 0) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') {
            handlePageAction(accFocus === 0 ? PACT_USER_SUBMIT : PACT_GROUP_SUBMIT);
        } else if (event.key === 'Backspace') {
            accInputs[accFocus] = accInputs[accFocus].slice(0, -1);
            syncAccounts();
        } else if (event.key === 'Escape') {
            accFocus = -1;
            instance.exports.SetAccountsFocus(-1);
        } else if (event.key.length === 1 && accInputs[accFocus].length < 32) {
            accInputs[accFocus] += event.key;
            syncAccounts();
        } else {
            return;
        }
        event.preventDefault();
    }

    // ----------------------------------------------------------------
    // Storage page: volumes + disk selection for create
    // ----------------------------------------------------------------
    const PAGE_STORAGE = 4;
    const PACT_VOL_CREATE = 10, PACT_VOL_DELETE = 11, PACT_VOL_SCRUB = 12,
          PACT_DISK_TOGGLE = 13, PACT_SCRUB_TOGGLE = 14;

    let storVolumes = [], storDisks = [];
    let storSelected = new Set();   // disk names picked for a new volume
    let storInput = '';
    let storError = '';

    function syncStorage() {
        let off = STOR_POOL_BASE;
        const write = (str) => {
            const bytes = textEncoder.encode(String(str).slice(0, 128));
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
            const r = { off, len: bytes.length };
            off += bytes.length;
            return r;
        };
        instance.exports.ClearStorVolumes();
        for (const v of storVolumes) {
            const name = write(v.name);
            const usage = write(v.mounted
                ? fmtBytes(v.used_kb * 1024) + ' / ' + fmtBytes(v.total_kb * 1024)
                : '(not mounted)');
            const disks = write((v.disks || []).map(d => d.replace('/dev/', '')).join(', '));
            instance.exports.AddStorVolume(v.id, name.off, name.len,
                usage.off, usage.len, disks.off, disks.len,
                v.used_pct || 0, v.scrub_enabled ? 1 : 0, v.mounted ? 1 : 0);
        }
        instance.exports.ClearStorDisks();
        for (const d of storDisks) {
            const isFree = !d.volume && !d.system;
            const name = write(d.name);
            const size = write(fmtBytes(d.size_bytes));
            const status = write(d.volume || (d.system ? 'system' : 'free'));
            const healthy = d.smart_health === 'PASSED' || d.smart_health === 'unknown';
            instance.exports.AddStorDisk(name.off, name.len, size.off, size.len,
                status.off, status.len, isFree ? 1 : 0,
                storSelected.has(d.name) ? 1 : 0, healthy ? 1 : 0);
        }
        const inp = write(storInput);
        instance.exports.SetStorInput(inp.off, inp.len);
        const err = write(storError);
        instance.exports.SetStorError(err.off, err.len);
    }

    async function loadStorage() {
        try {
            const [vols, disks] = await Promise.all([
                getJSON('/api/volumes'), getJSON('/api/disks')]);
            storVolumes = Array.isArray(vols.volumes) ? vols.volumes : [];
            storDisks = Array.isArray(disks.disks) ? disks.disks : [];
            const freeNames = new Set(storDisks.filter(d => !d.volume && !d.system).map(d => d.name));
            storSelected = new Set([...storSelected].filter(n => freeNames.has(n)));
        } catch (err) {
            storError = 'load failed: ' + err;
        }
        syncStorage();
    }

    async function storageMutate(promise) {
        storError = '';
        const { ok, data } = await promise;
        if (!ok) storError = data.error || 'request failed';
        await loadStorage();
    }

    function handleStorageAction(action, arg) {
        switch (action) {
            case PACT_VOL_CREATE:
                if (storInput && storSelected.size > 0) {
                    const name = storInput;
                    const disks = [...storSelected];
                    storInput = '';
                    storSelected = new Set();
                    storageMutate(postJSON('/api/volumes', { name, disks }));
                } else {
                    storError = 'pick a name and at least one free disk';
                    syncStorage();
                }
                break;
            case PACT_VOL_DELETE:
                storageMutate(sendJSON('DELETE', '/api/volumes/' + arg));
                break;
            case PACT_VOL_SCRUB:
                storageMutate(postJSON('/api/volumes/' + arg + '/scrub'));
                break;
            case PACT_SCRUB_TOGGLE: {
                const v = storVolumes.find(x => x.id === arg);
                if (v) storageMutate(sendJSON('PUT', '/api/volumes/' + arg + '/scrub/schedule',
                    { enabled: !v.scrub_enabled }));
                break;
            }
            case PACT_DISK_TOGGLE: {
                const d = storDisks[arg];
                if (!d || d.volume || d.system) break;
                if (storSelected.has(d.name)) storSelected.delete(d.name);
                else storSelected.add(d.name);
                syncStorage();
                break;
            }
        }
    }

    function handleStorageKey(event) {
        if (accFocus !== 2) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') {
            handleStorageAction(PACT_VOL_CREATE, 0);
        } else if (event.key === 'Backspace') {
            storInput = storInput.slice(0, -1);
            syncStorage();
        } else if (event.key === 'Escape') {
            accFocus = -1;
            instance.exports.SetAccountsFocus(-1);
        } else if (event.key.length === 1 && storInput.length < 16) {
            storInput += event.key;
            syncStorage();
        } else {
            return;
        }
        event.preventDefault();
    }

    // ----------------------------------------------------------------
    // Network page: IP config (DHCP/static), timezone, NTP. Apply is
    // two-click (armed) because a netif restart can drop the session.
    // ----------------------------------------------------------------
    const PAGE_NETWORK = 2;
    const PACT_NET_MODE = 15, PACT_NET_APPLY = 16, PACT_TZ_SAVE = 17,
          PACT_NTP_SAVE = 18;

    let netConfig = {}, netNtp = {};
    let netDhcp = true, netArmed = false;
    // focus indices 3..7 (see TextInputBox in main.c) map to these keys
    let netInputs = { ip: '', mask: '', gw: '', tz: '', ntp: '' };
    let netError = '', netInfo = '';

    function syncNetwork() {
        let off = NET_POOL_BASE;
        const write = (str) => {
            const bytes = textEncoder.encode(String(str).slice(0, 128));
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
            const r = { off, len: bytes.length };
            off += bytes.length;
            return r;
        };
        const iface = write(netConfig.interface || '-');
        const mac = write(netConfig.mac || '-');
        const live = write(netConfig.ip
            ? netConfig.ip + ' / ' + (netConfig.netmask || '?')
                + (netConfig.gateway ? ' via ' + netConfig.gateway : '')
            : '-');
        const ntpState = write(netNtp.enabled ? 'NTP enabled' : 'NTP disabled');
        instance.exports.SetNetConfig(iface.off, iface.len, mac.off, mac.len,
            live.off, live.len, ntpState.off, ntpState.len,
            netDhcp ? 1 : 0, netArmed ? 1 : 0);
        const ip = write(netInputs.ip), mask = write(netInputs.mask),
              gw = write(netInputs.gw), tz = write(netInputs.tz),
              ntp = write(netInputs.ntp);
        instance.exports.SetNetInputs(ip.off, ip.len, mask.off, mask.len,
            gw.off, gw.len, tz.off, tz.len, ntp.off, ntp.len);
        const err = write(netError), info = write(netInfo);
        instance.exports.SetNetMsg(err.off, err.len, info.off, info.len);
    }

    async function loadNetwork() {
        try {
            const [cfg, tz, ntp] = await Promise.all([
                getJSON('/api/network/config'),
                getJSON('/api/network/timezone'),
                getJSON('/api/network/ntp')]);
            netConfig = cfg;
            netNtp = ntp;
            netDhcp = !!cfg.dhcp;
            netArmed = false;
            netInputs.ip = cfg.ip || '';
            netInputs.mask = cfg.netmask || '';
            netInputs.gw = cfg.gateway || '';
            netInputs.tz = tz.timezone || '';
            netInputs.ntp = ntp.server || '';
        } catch (err) {
            netError = 'load failed: ' + err;
        }
        syncNetwork();
    }

    async function netMutate(promise, okMsg) {
        netError = '';
        netInfo = 'Applying...';
        syncNetwork();
        let msg = '', err = '';
        try {
            const { ok, data } = await promise;
            if (ok) msg = okMsg;
            else err = data.error || 'request failed';
        } catch (e) {
            err = 'network error';
        }
        await loadNetwork();
        netInfo = msg;
        netError = err;
        syncNetwork();
    }

    function handleNetworkAction(action, arg) {
        switch (action) {
            case PACT_NET_MODE:
                netDhcp = !netDhcp;
                netArmed = false;
                netInfo = '';
                syncNetwork();
                break;
            case PACT_NET_APPLY:
                if (!netDhcp && !(netInputs.ip && netInputs.mask && netInputs.gw)) {
                    netError = 'IP, netmask and gateway are required for static mode';
                    netArmed = false;
                    syncNetwork();
                    break;
                }
                if (!netArmed) {
                    netArmed = true;
                    netError = '';
                    netInfo = 'Networking will restart — click again to confirm';
                    syncNetwork();
                    break;
                }
                netArmed = false;
                netMutate(sendJSON('PUT', '/api/network/config', netDhcp
                    ? { dhcp: true }
                    : { dhcp: false, ip: netInputs.ip, netmask: netInputs.mask,
                        gateway: netInputs.gw }), 'Network config applied');
                break;
            case PACT_TZ_SAVE:
                if (!netInputs.tz) {
                    netError = 'timezone required';
                    syncNetwork();
                    break;
                }
                netMutate(sendJSON('PUT', '/api/network/timezone',
                    { timezone: netInputs.tz }), 'Timezone saved');
                break;
            case PACT_NTP_SAVE:
                netMutate(sendJSON('PUT', '/api/network/ntp',
                    { server: netInputs.ntp }),
                    netInputs.ntp ? 'NTP server saved' : 'NTP disabled');
                break;
        }
    }

    function handleNetworkKey(event) {
        if (accFocus < 3 || accFocus > 7) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        const key = ['ip', 'mask', 'gw', 'tz', 'ntp'][accFocus - 3];
        if (event.key === 'Enter') {
            if (accFocus === 6) handleNetworkAction(PACT_TZ_SAVE, 0);
            else if (accFocus === 7) handleNetworkAction(PACT_NTP_SAVE, 0);
            else handleNetworkAction(PACT_NET_APPLY, 0);
        } else if (event.key === 'Backspace') {
            netInputs[key] = netInputs[key].slice(0, -1);
            netArmed = false;
            syncNetwork();
        } else if (event.key === 'Escape') {
            accFocus = -1;
            instance.exports.SetAccountsFocus(-1);
        } else if (event.key.length === 1 && netInputs[key].length < 64) {
            netInputs[key] += event.key;
            netArmed = false;
            syncNetwork();
        } else {
            return;
        }
        event.preventDefault();
    }

    // ----------------------------------------------------------------
    // Backup page: snapshots, S3 bucket configs, sync status polling,
    // restore browser. The browser's pseudo-root lists volumes as
    // directories; descending into one browses that volume's backup.
    // ----------------------------------------------------------------
    const PAGE_BACKUP = 5;
    const PACT_SNAP_CREATE = 19, PACT_SNAP_DELETE = 20, PACT_SNAP_SCHED = 21,
          PACT_S3_ADD = 22, PACT_S3_DELETE = 23, PACT_S3_BACKUP = 24,
          PACT_S3_BROWSE = 25, PACT_BROWSE_NAV = 26;

    let bakVolumes = [], bakSnaps = [], bakBuckets = [];
    let bakSched = true;
    let bakStatus = { state: 'idle' };
    // focus indices 8..12 (see S3Card in main.c)
    let bakInputs = { name: '', endpoint: '', access: '', secret: '', password: '' };
    let bakError = '', bakInfo = '';
    let browseOpen = false, browseBucket = 0, browseVolume = '', browsePath = '/';
    let browseRowDefs = [];   // aligned with rows pushed to C
    let bakStatusTimer = null;

    function bakStatusLine() {
        if (bakStatus.state === 'running')
            return 'Backup running — ' + (bakStatus.phase || '?')
                + (bakStatus.volume ? ' (' + bakStatus.volume + ')' : '');
        if (bakStatus.state === 'error')
            return 'Backup failed: ' + (bakStatus.detail || bakStatus.phase || '?');
        if (bakStatus.state === 'done')
            return 'Last backup completed ' + (bakStatus.updated_at || '');
        return '';
    }

    function syncBackup() {
        let off = BAK_POOL_BASE;
        const write = (str) => {
            const bytes = textEncoder.encode(String(str).slice(0, 160));
            new Uint8Array(instance.exports.memory.buffer, stringPoolBase + off, bytes.length).set(bytes);
            const r = { off, len: bytes.length };
            off += bytes.length;
            return r;
        };
        instance.exports.ClearBakVolumes();
        for (const v of bakVolumes) {
            const name = write(v.name);
            instance.exports.AddBakVolume(v.id, name.off, name.len);
        }
        instance.exports.ClearSnapshots();
        for (const s of bakSnaps.slice(0, 32)) {
            const vol = write(s.volume);
            const name = write(s.name);
            const ret = write(s.retention || 'manual');
            const created = write(s.created_at || '');
            instance.exports.AddSnapshot(s.id, vol.off, vol.len, name.off, name.len,
                ret.off, ret.len, created.off, created.len);
        }
        instance.exports.ClearBuckets();
        for (const b of bakBuckets) {
            const name = write(b.name);
            const ep = write(b.endpoint);
            instance.exports.AddBucket(b.id, name.off, name.len, ep.off, ep.len);
        }
        const status = write(bakStatusLine());
        instance.exports.SetBakState(bakSched ? 1 : 0,
            bakStatus.state === 'running' ? 1 : 0, status.off, status.len);
        const inName = write(bakInputs.name), inEp = write(bakInputs.endpoint),
              inAk = write(bakInputs.access),
              inSk = write('•'.repeat(bakInputs.secret.length)),
              inPw = write('•'.repeat(bakInputs.password.length));
        instance.exports.SetBakInputs(inName.off, inName.len, inEp.off, inEp.len,
            inAk.off, inAk.len, inSk.off, inSk.len, inPw.off, inPw.len);
        const err = write(bakError), info = write(bakInfo);
        instance.exports.SetBakMsg(err.off, err.len, info.off, info.len);
        instance.exports.ClearBrowse();
        for (const r of browseRowDefs.slice(0, 32)) {
            const label = write(r.label);
            instance.exports.AddBrowseRow(label.off, label.len, r.dir ? 1 : 0);
        }
        const bp = write(browseVolume ? browseVolume + browsePath : '');
        instance.exports.SetBrowsePath(bp.off, bp.len, browseOpen ? 1 : 0);
    }

    async function loadBackup() {
        try {
            const [vols, snaps, sched, s3, status] = await Promise.all([
                getJSON('/api/volumes'), getJSON('/api/snapshots'),
                getJSON('/api/snapshots/schedule'), getJSON('/api/s3'),
                getJSON('/api/backup/status')]);
            bakVolumes = Array.isArray(vols.volumes) ? vols.volumes : [];
            bakSnaps = Array.isArray(snaps.snapshots) ? snaps.snapshots : [];
            bakBuckets = Array.isArray(s3.buckets) ? s3.buckets : [];
            bakSched = !!sched.enabled;
            bakStatus = status;
            watchBakStatus();
        } catch (err) {
            bakError = 'load failed: ' + err;
        }
        syncBackup();
    }

    function watchBakStatus() {
        if (bakStatus.state !== 'running' || bakStatusTimer) return;
        bakStatusTimer = setTimeout(async () => {
            bakStatusTimer = null;
            try {
                const prev = bakStatus.state;
                bakStatus = await getJSON('/api/backup/status');
                if (bakStatus.state === 'running') watchBakStatus();
                else if (prev === 'running') { loadBackup(); return; }
            } catch (e) {}
            syncBackup();
        }, 2000);
    }

    async function backupMutate(promise, okMsg) {
        bakError = '';
        bakInfo = '';
        try {
            const { ok, data } = await promise;
            if (!ok) bakError = data.error || 'request failed';
            else if (okMsg) bakInfo = okMsg;
        } catch (e) {
            bakError = 'network error';
        }
        await loadBackup();
    }

    function browseVolumeList() {
        browseVolume = '';
        browsePath = '/';
        browseRowDefs = bakVolumes.map(v => ({
            label: v.name + '/', dir: true, volume: v.name, path: '/' }));
    }

    async function browseLoad(volume, path) {
        try {
            const data = await getJSON('/api/restore/browse?bucket_id=' + browseBucket
                + '&volume=' + encodeURIComponent(volume)
                + '&path=' + encodeURIComponent(path));
            browseVolume = volume;
            browsePath = data.path || path;
            const entries = Array.isArray(data.entries) ? data.entries : [];
            browseRowDefs = [{ label: '../', dir: true, up: true }];
            for (const e of entries) {
                browseRowDefs.push({
                    label: e.name + (e.dir ? '/' : '') +
                        (e.size ? '  (' + e.size + ')' : '') +
                        (e.mtime ? '  ' + e.mtime : ''),
                    dir: !!e.dir, volume, path: e.path,
                });
            }
            bakError = '';
        } catch (err) {
            bakError = 'browse failed: ' + err;
        }
        syncBackup();
    }

    function handleBackupAction(action, arg) {
        switch (action) {
            case PACT_SNAP_CREATE:
                backupMutate(postJSON('/api/snapshots', { volume_id: arg }), 'Snapshot created');
                break;
            case PACT_SNAP_DELETE:
                backupMutate(sendJSON('DELETE', '/api/snapshots/' + arg));
                break;
            case PACT_SNAP_SCHED:
                backupMutate(sendJSON('PUT', '/api/snapshots/schedule', { enabled: !bakSched }));
                break;
            case PACT_S3_ADD: {
                if (!bakInputs.name || !bakInputs.endpoint || !bakInputs.password) {
                    bakError = 'bucket, endpoint and password are required';
                    syncBackup();
                    break;
                }
                const body = { name: bakInputs.name, endpoint: bakInputs.endpoint,
                    access_key: bakInputs.access, secret_key: bakInputs.secret,
                    cryfs_password: bakInputs.password };
                bakInputs = { name: '', endpoint: '', access: '', secret: '', password: '' };
                backupMutate(postJSON('/api/s3', body), 'Bucket added');
                break;
            }
            case PACT_S3_DELETE:
                if (browseBucket === arg) { browseOpen = false; browseRowDefs = []; }
                backupMutate(sendJSON('DELETE', '/api/s3/' + arg));
                break;
            case PACT_S3_BACKUP:
                if (bakStatus.state === 'running') break;
                backupMutate(postJSON('/api/backup/sync', { bucket_id: arg }), 'Backup started');
                break;
            case PACT_S3_BROWSE:
                if (browseOpen && browseBucket === arg) {
                    browseOpen = false;
                    browseRowDefs = [];
                } else {
                    browseBucket = arg;
                    browseOpen = true;
                    browseVolumeList();
                }
                syncBackup();
                break;
            case PACT_BROWSE_NAV: {
                const row = browseRowDefs[arg];
                if (!row || !row.dir) break;
                if (row.up) {
                    if (browsePath === '/' || browsePath === '') {
                        browseVolumeList();
                        syncBackup();
                    } else {
                        const parent = browsePath.replace(/\/[^/]+$/, '') || '/';
                        browseLoad(browseVolume, parent);
                    }
                } else {
                    browseLoad(row.volume, row.path);
                }
                break;
            }
        }
    }

    function handleBackupKey(event) {
        if (accFocus < 8 || accFocus > 12) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        const key = ['name', 'endpoint', 'access', 'secret', 'password'][accFocus - 8];
        if (event.key === 'Enter') {
            handleBackupAction(PACT_S3_ADD, 0);
        } else if (event.key === 'Backspace') {
            bakInputs[key] = bakInputs[key].slice(0, -1);
            syncBackup();
        } else if (event.key === 'Escape') {
            accFocus = -1;
            instance.exports.SetAccountsFocus(-1);
        } else if (event.key.length === 1 && bakInputs[key].length < 128) {
            bakInputs[key] += event.key;
            syncBackup();
        } else {
            return;
        }
        event.preventDefault();
    }

    let prevCpuTicks = null;

    async function refreshDashboard() {
        const setStatus = (text) => {
            poolReset();
            const s = poolWrite(text);
            instance.exports.SetStatus(s.off, s.len);
        };
        try {
            const [system, cpu, memory, disks, volumes] = await Promise.all([
                getJSON('/api/dashboard/system'),
                getJSON('/api/dashboard/cpu'),
                getJSON('/api/dashboard/memory'),
                getJSON('/api/dashboard/disks'),
                getJSON('/api/dashboard/volumes'),
            ]);

            poolReset();

            // Status (header right side)
            const st = poolWrite(system.hostname + ' · ' + new Date().toLocaleTimeString());
            instance.exports.SetStatus(st.off, st.len);

            // System card
            const host = poolWrite(system.hostname || '-');
            const os = poolWrite((system.os || '') + ' ' + (system.os_release || ''));
            const up = poolWrite(fmtUptime(system.uptime_sec));
            const load = poolWrite((system.loadavg || []).map(x => x.toFixed(2)).join('  '));
            instance.exports.SetSystem(host.off, host.len, os.off, os.len, up.off, up.len, load.off, load.len);

            // CPU: usage from cp_time deltas between polls
            let cpuPct = 0;
            const t = cpu.cp_time || {};
            const ticks = [t.user || 0, t.nice || 0, t.sys || 0, t.intr || 0, t.idle || 0];
            if (prevCpuTicks) {
                const delta = ticks.map((v, i) => v - prevCpuTicks[i]);
                const total = delta.reduce((a, b) => a + b, 0);
                if (total > 0) cpuPct = 100 * (total - delta[4]) / total;
            }
            prevCpuTicks = ticks;
            const cl = poolWrite(cpuPct.toFixed(1) + '%');
            instance.exports.SetCpu(cpuPct, cl.off, cl.len);

            // Memory
            const used = (memory.physmem || 0) - (memory.free || 0);
            const memPct = memory.physmem ? 100 * used / memory.physmem : 0;
            const ml = poolWrite(fmtBytes(used) + ' / ' + fmtBytes(memory.physmem));
            instance.exports.SetMemory(memPct, ml.off, ml.len);

            // Volumes ({} when empty — lua cjson encodes empty arrays as objects)
            instance.exports.ClearVolumes();
            const volList = Array.isArray(volumes.volumes) ? volumes.volumes : [];
            for (const v of volList) {
                const name = poolWrite(v.mountpoint || v.device);
                const label = poolWrite(fmtBytes(v.used_kb * 1024) + ' / ' + fmtBytes(v.total_kb * 1024));
                instance.exports.AddVolume(name.off, name.len, v.used_pct || 0, label.off, label.len);
            }

            // Disks
            instance.exports.ClearDisks();
            const diskList = Array.isArray(disks.disks) ? disks.disks : [];
            for (const d of diskList) {
                const name = poolWrite(d.name);
                const size = poolWrite(fmtBytes(d.size_bytes));
                const health = poolWrite(d.smart_health || 'unknown');
                const healthy = d.smart_health === 'PASSED' || d.smart_health === 'unknown';
                instance.exports.AddDisk(name.off, name.len, size.off, size.len, health.off, health.len, healthy ? 1 : 0);
            }
        } catch (err) {
            if (err === 'unauthorized') {
                // Session expired — stop polling and return to login
                if (dashboardTimer) {
                    clearInterval(dashboardTimer);
                    dashboardTimer = null;
                }
                setAuthScreen(SCREEN_LOGIN_USERNAME);
            } else {
                setStatus('API error: ' + err);
            }
        }
    }

    async function init() {
        window.htmlRoot = document.body.appendChild(document.createElement('div'));
        window.canvasRoot = document.body.appendChild(document.createElement('canvas'));
        window.canvasRoot.style.display = 'none';
        window.canvasContext = window.canvasRoot.getContext("2d");
        window.mousePositionXThisFrame = 0;
        window.mousePositionYThisFrame = 0;
        window.mouseWheelXThisFrame = 0;
        window.mouseWheelYThisFrame = 0;
        window.touchDown = false;

        function handleTouch (event) {
            if (event.touches.length === 1) {
                window.touchDown = true;
                let target = event.target;
                let scrollTop = 0;
                let scrollLeft = 0;
                while (target) {
                    scrollLeft += target.scrollLeft;
                    scrollTop += target.scrollTop;
                    target = target.parentElement;
                }
                window.mousePositionXThisFrame = event.changedTouches[0].pageX + scrollLeft;
                window.mousePositionYThisFrame = event.changedTouches[0].pageY + scrollTop;
            }
        }

        document.addEventListener("touchstart", handleTouch);
        document.addEventListener("touchmove", handleTouch);
        document.addEventListener("touchend", () => {
            window.touchDown = false;
            window.mousePositionXThisFrame = 0;
            window.mousePositionYThisFrame = 0;
        })

        document.addEventListener("mousemove", (event) => {
            let target = event.target;
            let scrollTop = 0;
            let scrollLeft = 0;
            while (target) {
                scrollLeft += target.scrollLeft;
                scrollTop += target.scrollTop;
                target = target.parentElement;
            }
            window.mousePositionXThisFrame = event.x + scrollLeft;
            window.mousePositionYThisFrame = event.y + scrollTop;
        });

        document.addEventListener("mousedown", () => {
            window.mouseDown = true;
            window.mouseDownThisFrame = true;
        });

        document.addEventListener("mouseup", () => {
            window.mouseDown = false;
        });

        const importObject = {
            clay: {
                measureTextFunction: (addressOfDimensions, textToMeasure, addressOfConfig, userData) => {
                    let stringLength = memoryDataView.getUint32(textToMeasure, true);
                    let pointerToString = memoryDataView.getUint32(textToMeasure + 4, true);
                    let textConfig = readStructAtAddress(addressOfConfig, textConfigDefinition);
                    let text = textDecoder.decode(memoryDataView.buffer.slice(pointerToString, pointerToString + stringLength));
                    let sourceDimensions = getTextDimensions(text, `${Math.round(textConfig.fontSize.value * GLOBAL_FONT_SCALING_FACTOR)}px ${fontsById[textConfig.fontId.value]}`);
                    memoryDataView.setFloat32(addressOfDimensions, sourceDimensions.width, true);
                    memoryDataView.setFloat32(addressOfDimensions + 4, sourceDimensions.height, true);
                },
                queryScrollOffsetFunction: (addressOfOffset, elementId) => {
                    let container = document.getElementById(elementId.toString());
                    if (container) {
                        memoryDataView.setFloat32(addressOfOffset, -container.scrollLeft, true);
                        memoryDataView.setFloat32(addressOfOffset + 4, -container.scrollTop, true);
                    }
                },
            },
        };
        const { instance } = await WebAssembly.instantiateStreaming(
            fetch("/clay.wasm"), importObject
        );
        memoryDataView = new DataView(new Uint8Array(instance.exports.memory.buffer).buffer);
        scratchSpaceAddress = instance.exports.__heap_base.value;
        let clayScratchSpaceAddress = instance.exports.__heap_base.value + 1024;
        heapSpaceAddress = instance.exports.__heap_base.value + 2048;
        let arenaAddress = scratchSpaceAddress + 8;
        window.instance = instance;
        createMainArena(arenaAddress, heapSpaceAddress);
        memoryDataView.setFloat32(instance.exports.__heap_base.value, window.innerWidth, true);
        memoryDataView.setFloat32(instance.exports.__heap_base.value + 4, window.innerHeight, true);
        instance.exports.Clay_Initialize(arenaAddress, instance.exports.__heap_base.value);
        instance.exports.SetScratchMemory(clayScratchSpaceAddress);
        renderCommandSize = getStructTotalSize(renderCommandDefinition);
        stringPoolBase = instance.exports.GetStringPool();
        document.addEventListener("keydown", handleAuthKey);
        startApp();
        renderLoop();
    }

    function MemoryIsDifferent(one, two, length) {
        for (let i = 0; i < length; i++) {
            if (one[i] !== two[i]) {
                return true;
            }
        }
        return false;
    }

    function SetElementBackgroundColorAndRadius(element, cornerRadius, backgroundColor) {
        element.style.backgroundColor = `rgba(${backgroundColor.r.value}, ${backgroundColor.g.value}, ${backgroundColor.b.value}, ${backgroundColor.a.value / 255})`;
        if (cornerRadius.topLeft.value > 0) {
            element.style.borderTopLeftRadius = cornerRadius.topLeft.value + 'px';
        }
        if (cornerRadius.topRight.value > 0) {
            element.style.borderTopRightRadius = cornerRadius.topRight.value + 'px';
        }
        if (cornerRadius.bottomLeft.value > 0) {
            element.style.borderBottomLeftRadius = cornerRadius.bottomLeft.value + 'px';
        }
        if (cornerRadius.bottomRight.value > 0) {
            element.style.borderBottomRightRadius = cornerRadius.bottomRight.value + 'px';
        }
    }

    function renderLoopHTML() {
        let capacity = memoryDataView.getInt32(scratchSpaceAddress, true);
        let length = memoryDataView.getInt32(scratchSpaceAddress + 4, true);
        let arrayOffset = memoryDataView.getUint32(scratchSpaceAddress + 8, true);
        let scissorStack = [{ nextAllocation: { x: 0, y: 0 }, element: htmlRoot, nextElementIndex: 0 }];
        let previousId = 0;
        for (let i = 0; i < length; i++, arrayOffset += renderCommandSize) {
            let entireRenderCommandMemory = new Uint8Array(memoryDataView.buffer.slice(arrayOffset, arrayOffset + renderCommandSize));
            let renderCommand = readStructAtAddress(arrayOffset, renderCommandDefinition);
            let parentElement = scissorStack[scissorStack.length - 1];
            let element = null;
            let isMultiConfigElement = previousId === renderCommand.id.value;
            if (!elementCache[renderCommand.id.value]) {
                let elementType = 'div';
                switch (renderCommand.commandType.value & 0xff) {
                    case CLAY_RENDER_COMMAND_TYPE_TEXT:
                    case CLAY_RENDER_COMMAND_TYPE_RECTANGLE: {
                        if (renderCommand.userData.value !== 0) {
                            if (readStructAtAddress(renderCommand.userData.value, customHTMLDataDefinition).link.length.value > 0) {
                                elementType = 'a';
                            }
                        }
                        break;
                    }
                    case CLAY_RENDER_COMMAND_TYPE_IMAGE: {
                        elementType = 'img'; break;
                    }
                    default: break;
                }
                element = document.createElement(elementType);
                element.id = renderCommand.id.value;
                if (renderCommand.commandType.value === CLAY_RENDER_COMMAND_TYPE_SCISSOR_START) {
                    element.style.overflow = 'hidden';
                }
                elementCache[renderCommand.id.value] = {
                    exists: true,
                    element: element,
                    previousMemoryCommand: new Uint8Array(0),
                    previousMemoryConfig: new Uint8Array(0),
                    previousMemoryText: new Uint8Array(0)
                };
            }

            let elementData = elementCache[renderCommand.id.value];
            element = elementData.element;
            if (!isMultiConfigElement && Array.prototype.indexOf.call(parentElement.element.children, element) !== parentElement.nextElementIndex) {
                if (parentElement.nextElementIndex === 0) {
                    parentElement.element.insertAdjacentElement('afterbegin', element);
                } else {
                    parentElement.element.childNodes[Math.min(parentElement.nextElementIndex - 1, parentElement.element.childNodes.length - 1)].insertAdjacentElement('afterend', element);
                }
            }

            elementData.exists = true;
            let dirty = MemoryIsDifferent(elementData.previousMemoryCommand, entireRenderCommandMemory, renderCommandSize) && !isMultiConfigElement;
            if (!isMultiConfigElement) {
                parentElement.nextElementIndex++;
            }

            previousId = renderCommand.id.value;

            elementData.previousMemoryCommand = entireRenderCommandMemory;
            let offsetX = scissorStack.length > 0 ? scissorStack[scissorStack.length - 1].nextAllocation.x : 0;
            let offsetY = scissorStack.length > 0 ? scissorStack[scissorStack.length - 1].nextAllocation.y : 0;
            if (dirty) {
                element.style.transform = `translate(${Math.round(renderCommand.boundingBox.x.value - offsetX)}px, ${Math.round(renderCommand.boundingBox.y.value - offsetY)}px)`
                element.style.width = Math.round(renderCommand.boundingBox.width.value) + 'px';
                element.style.height = Math.round(renderCommand.boundingBox.height.value) + 'px';
            }

            switch(renderCommand.commandType.value & 0xff) {
                case (CLAY_RENDER_COMMAND_TYPE_NONE): {
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_RECTANGLE): {
                    let config = renderCommand.renderData.rectangle;
                    let configMemory = JSON.stringify(config);
                    if (configMemory === elementData.previousMemoryConfig) {
                        break;
                    }

                    SetElementBackgroundColorAndRadius(element, config.cornerRadius, config.backgroundColor);
                    if (renderCommand.userData.value !== 0) {
                        let customData = readStructAtAddress(renderCommand.userData.value, customHTMLDataDefinition);

                        let linkContents = customData.link.length.value > 0 ? textDecoder.decode(new Uint8Array(memoryDataView.buffer.slice(customData.link.chars.value, customData.link.chars.value + customData.link.length.value))) : 0;
                        memoryDataView.setUint32(0, renderCommand.id.value, true);
                        if (linkContents.length > 0 && (window.mouseDownThisFrame || window.touchDown) && instance.exports.Clay_PointerOver(0)) {
                            window.location.href = linkContents;
                        }
                        if (linkContents.length > 0) {
                            element.href = linkContents;
                        }

                        if (linkContents.length > 0 || customData.cursorPointer.value) {
                            element.style.pointerEvents = 'all';
                            element.style.cursor = 'pointer';
                        }
                    }

                    elementData.previousMemoryConfig = configMemory;

                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_BORDER): {
                    let config = renderCommand.renderData.border;
                    let configMemory = JSON.stringify(config);
                    if (configMemory === elementData.previousMemoryConfig) {
                        break;
                    }
                    let color = config.color;
                    elementData.previousMemoryConfig = configMemory;
                    if (config.width.left.value > 0) {
                        element.style.borderLeft = `${config.width.left.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.right.value > 0) {
                        element.style.borderRight = `${config.width.right.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.top.value > 0) {
                        element.style.borderTop = `${config.width.top.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.width.bottom.value > 0) {
                        element.style.borderBottom = `${config.width.bottom.value}px solid rgba(${color.r.value}, ${color.g.value}, ${color.b.value}, ${color.a.value / 255})`
                    }
                    if (config.cornerRadius.topLeft.value > 0) {
                        element.style.borderTopLeftRadius = config.cornerRadius.topLeft.value + 'px';
                    }
                    if (config.cornerRadius.topRight.value > 0) {
                        element.style.borderTopRightRadius = config.cornerRadius.topRight.value + 'px';
                    }
                    if (config.cornerRadius.bottomLeft.value > 0) {
                        element.style.borderBottomLeftRadius = config.cornerRadius.bottomLeft.value + 'px';
                    }
                    if (config.cornerRadius.bottomRight.value > 0) {
                        element.style.borderBottomRightRadius = config.cornerRadius.bottomRight.value + 'px';
                    }
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_TEXT): {
                    let config = renderCommand.renderData.text;
                    let configMemory = JSON.stringify(config);
                    let stringContents = new Uint8Array(memoryDataView.buffer.slice(config.stringContents.chars.value, config.stringContents.chars.value + config.stringContents.length.value));
                    if (configMemory !== elementData.previousMemoryConfig) {
                        element.className = 'text';
                        let textColor = config.textColor;
                        let fontSize = Math.round(config.fontSize.value * GLOBAL_FONT_SCALING_FACTOR);
                        element.style.color = `rgba(${textColor.r.value}, ${textColor.g.value}, ${textColor.b.value}, ${textColor.a.value})`;
                        element.style.fontFamily = fontsById[config.fontId.value];
                        element.style.fontSize = fontSize + 'px';
                        if (renderCommand.userData.value !== 0) {
                            let customData = readStructAtAddress(renderCommand.userData.value, customHTMLDataDefinition);
                            element.style.pointerEvents = customData.disablePointerEvents.value ? 'none' : 'all';
                        }
                        elementData.previousMemoryConfig = configMemory;
                    }
                    if (stringContents.length !== elementData.previousMemoryText.length || MemoryIsDifferent(stringContents, elementData.previousMemoryText, stringContents.length)) {
                        element.innerHTML = textDecoder.decode(stringContents);
                    }
                    elementData.previousMemoryText = stringContents;
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_SCISSOR_START): {
                    scissorStack.push({ nextAllocation: { x: renderCommand.boundingBox.x.value, y: renderCommand.boundingBox.y.value }, element, nextElementIndex: 0 });
                    let config = renderCommand.renderData.clip;
                    let configMemory = JSON.stringify(config);
                    if (configMemory === elementData.previousMemoryConfig) {
                        break;
                    }
                    if (config.horizontal.value) {
                        element.style.overflowX = 'scroll';
                        element.style.pointerEvents = 'auto';
                    }
                    if (config.vertical.value) {
                        element.style.overflowY = 'scroll';
                        element.style.pointerEvents = 'auto';
                    }
                    elementData.previousMemoryConfig = configMemory;
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_SCISSOR_END): {
                    scissorStack.splice(scissorStack.length - 1, 1);
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_IMAGE): {
                    let config = renderCommand.renderData.image;
                    let imageURL = readStructAtAddress(config.imageData.value, stringDefinition);
                    let srcContents = new Uint8Array(memoryDataView.buffer.slice(imageURL.chars.value, imageURL.chars.value + imageURL.length.value));
                    if (srcContents.length !== elementData.previousMemoryText.length || MemoryIsDifferent(srcContents, elementData.previousMemoryText, srcContents.length)) {
                        element.src = textDecoder.decode(srcContents);
                    }
                    elementData.previousMemoryText = srcContents;
                    break;
                }
                case (CLAY_RENDER_COMMAND_TYPE_CUSTOM): break;
                default: {
                    console.log("Error: unhandled render command");
                }
            }
        }

        for (const key of Object.keys(elementCache)) {
            if (elementCache[key].exists) {
                elementCache[key].exists = false;
            } else {
                elementCache[key].element.remove();
                delete elementCache[key];
            }
        }
    }

    function renderLoop(currentTime) {
        const elapsed = currentTime - previousFrameTime;
        previousFrameTime = currentTime;
        instance.exports.UpdateDrawFrame(scratchSpaceAddress, window.innerWidth, window.innerHeight, 0, 0, window.mousePositionXThisFrame, window.mousePositionYThisFrame, window.touchDown, window.mouseDown, 0, 0, 0, elapsed / 1000);
        const authAction = instance.exports.TakeAction();
        if (authAction === ACTION_SUBMIT) {
            submitAuth();
        } else if (authAction === ACTION_BACK) {
            backAuth();
        }
        if (authScreen === SCREEN_MAIN) {
            const page = instance.exports.GetActivePage();
            if (page !== lastActivePage) {
                lastActivePage = page;
                if (page === PAGE_ACCOUNTS) loadAccounts();
                else if (page === PAGE_STORAGE) loadStorage();
                else if (page === PAGE_NETWORK) loadNetwork();
                else if (page === PAGE_BACKUP) loadBackup();
            }
            const pageAction = instance.exports.TakePageAction();
            if (pageAction) handlePageAction(pageAction);
        }
        renderLoopHTML();
        requestAnimationFrame(renderLoop);
        window.mouseDownThisFrame = false;
    }
    init();
</script>

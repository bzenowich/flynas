user www flynas;
worker_processes auto;
error_log /var/log/flynas/error.log;
pid /var/run/flynas/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /usr/local/nginx/conf/mime.types;
    default_type application/octet-stream;
    access_log /var/log/flynas/access.log;

    lua_package_path '/usr/local/flynas/lua/?.lua;/usr/local/lualib/?.lua;/usr/local/share/lua/5.1/?.lua;;';
    lua_package_cpath '/usr/local/lualib/?.so;/usr/local/lib/lua/5.1/?.so;;';

    lua_shared_dict rate_limit 1m;

    init_by_lua_file /usr/local/flynas/lua/init.lua;
    init_worker_by_lua_file /usr/local/flynas/lua/monitor_worker.lua;

    server {
        listen 443 ssl;
        ssl_certificate /usr/local/flynas/ssl/cert.pem;
        ssl_certificate_key /usr/local/flynas/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            root /usr/local/flynas/static;
            index index.html;
        }

        location /api/ {
            content_by_lua_file /usr/local/flynas/lua/router.lua;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}

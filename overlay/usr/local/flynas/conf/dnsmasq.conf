# FlyNAS guest DHCP/DNS on the NAT bridge (flynas0). Started by
# flynas-helper netbridge up; reservations live in the dhcp-hostsfile
# (rewritten by the API per VM, reloaded with SIGHUP).
interface=flynas0
bind-interfaces
except-interface=lo0

# Hand out 10.77.0.x; reserved VMs get fixed IPs from the hostsfile.
dhcp-range=10.77.0.50,10.77.0.250,255.255.255.0,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
dhcp-authoritative
dhcp-hostsfile=/var/run/flynas/dhcp-hosts
dhcp-leasefile=/var/run/flynas/dnsmasq.leases
pid-file=/var/run/flynas/dnsmasq.pid

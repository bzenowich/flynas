# FlyNAS guest DHCP/DNS on the NAT bridge (flynas0). Started by
# flynas-helper netbridge up; reservations live in the dhcp-hostsfile
# (rewritten by the API per VM, reloaded with SIGHUP).
interface=flynas0
bind-interfaces
except-interface=lo0

# dnsmasq drops privileges after binding, to `nobody` by default. Its runtime
# dir (/var/run/flynas) is deliberately 2770 root:flynas so that QEMU's QMP and
# serial sockets stay group-only — which means plain `nobody` cannot even
# traverse it, and dnsmasq then fails to read this file's dhcp-hostsfile with
# "Permission denied" and silently serves no reservations. Dropping into the
# flynas group instead keeps it unprivileged and lets it through.
group=flynas

# Reservations only — no dynamic pool. `static` tells dnsmasq to serve this
# subnet but allocate nothing on its own, so the only address a guest can get
# is the one reserved for its MAC in the hostsfile.
#
# This used to be a .50-.250 pool, which overlapped the reservation range
# (10.77.0.<100+id>) and made a real race losable: a guest that DHCPDISCOVERed
# before dnsmasq had re-read the hostsfile got a *valid* dynamic lease for 12h,
# and the port-forwards then pointed at the wrong address. With no pool the
# same race just costs a retry — the guest gets NAKed (dhcp-authoritative,
# below) and asks again until the reservation is live, which is the answer we
# wanted all along. The trade is that a VM with no reservation never gets an
# address; every VM created through the API has one (vms.create assigns
# ip_address and syncs before the guest can boot), and failing loudly beats a
# silently wrong IP.
dhcp-range=10.77.0.0,static,255.255.255.0,12h
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
dhcp-authoritative
dhcp-hostsfile=/var/run/flynas/dhcp-hosts
dhcp-leasefile=/var/run/flynas/dnsmasq.leases
pid-file=/var/run/flynas/dnsmasq.pid
